# Three Mess3 factors with two interaction channels of different strength:
#   factor 0 -> factor 1 (strong, eps 0.8) and factor 1 -> factor 2 (weak, eps 0.3).
# Tests whether the joint structure is learned in steps, stronger channel first: compare
# the subspace overlaps factor0|factor1 and factor1|factor2, and per-factor probe R^2.
# (Single-channel gaps for these settings: roughly 3e-3 and 2e-4 nats/token.)
name: factored_two_channels
process:
  type: product
  factors:
    - {type: mess3, x: 0.1, alpha: 0.8}
    - {type: mess3, x: 0.1, alpha: 0.8}
    - {type: mess3, x: 0.1, alpha: 0.8}
  couplings:
    - controller: 0
      target: 1
      control: state
      eps: 0.8
      variants:
        - {type: mess3, x: 0.1, alpha: 0.8}
        - {type: relabel, perm: [1, 2, 0], process: {type: mess3, x: 0.1, alpha: 0.8}}
        - {type: relabel, perm: [2, 0, 1], process: {type: mess3, x: 0.1, alpha: 0.8}}
    - controller: 1
      target: 2
      control: state
      eps: 0.3
      variants:
        - {type: mess3, x: 0.1, alpha: 0.8}
        - {type: relabel, perm: [1, 2, 0], process: {type: mess3, x: 0.1, alpha: 0.8}}
        - {type: relabel, perm: [2, 0, 1], process: {type: mess3, x: 0.1, alpha: 0.8}}
data: {ctx_len: 16, bos: true, batch_size: 2048}
model:
  n_layers: 4
  d_model: 120
  n_heads: 3
  d_mlp: 480
  act: gelu
  norm: layernorm
  pos: learned
  init_std: 0.02
train: {n_seeds: 4, steps: 30000, optimizer: adam, lr: 5.0e-4, log_every: 100}
eval: {n_sequences: 4096, dense_until: 50, per_decade: 20}

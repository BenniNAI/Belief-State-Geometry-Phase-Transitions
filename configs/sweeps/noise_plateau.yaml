# Plateau length vs noise strength (Shai et al. 2026, Fig. 4 setting), with the two most
# likely confounders: initialisation scale and learning rate.
# Analyse with:  python -m bsg.summarize runs/noise_plateau --ref factored --x process.noise
base: ../factored_noise.yaml
name: noise_plateau
set:
  train.steps: 5000
  train.n_seeds: 4
grid:
  process.noise: [0.01, 0.02, 0.05, 0.1, 0.2, 0.3, 0.5]
  model.init_std: [0.02, 0.05]
